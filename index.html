<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<title>Modeler My ArQ · editor de planos</title>
<style>
:root{--bg:#eef0f3;--pan:#fff;--ink:#1c2430;--mut:#667085;--line:#d8dce3;--acc:#1b57e4;--acc2:#e8eefc;--red:#c0392b;--hd:#1b2a41}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
header h1 small{font-weight:400;opacity:.65;margin-left:6px}
header .sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;min-height:30px}
button:hover{border-color:#aab3c2}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--red)}
button:disabled{opacity:.4;cursor:default}
header button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
header button:hover{background:rgba(255,255,255,.2)}
header button.pri{background:var(--acc);border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
#panel{width:390px;max-width:46vw;background:var(--pan);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;background:none;padding:9px 4px;font-weight:600;color:var(--mut)}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--acc2)}
.tab{display:none;overflow:auto;padding:10px;flex:1;min-height:0}
.tab.on{display:block}
h3{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
th{font-size:11px;color:var(--mut);text-align:left;padding:2px 3px;font-weight:600}
td{padding:2px 2px}
tr.sel td{background:var(--acc2)}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;width:100%;background:#fff}
input.n{text-align:right;font-variant-numeric:tabular-nums}
input.nm{font-weight:700;min-width:52px}
input[type=color]{width:34px;height:30px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff}
input[type=checkbox]{width:auto;min-height:0}
button.x{padding:2px 8px;min-height:28px;color:var(--red)}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label{font-size:12px;color:var(--mut)}
.lot{border:1px solid var(--line);border-radius:9px;padding:8px;margin:8px 0}
.lot.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.lot .stats{font-size:12px;color:var(--mut);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:14px;padding:1px 4px 1px 8px;background:#fafbfc;font-weight:600;font-size:12px}
.chip button{border:0;background:none;padding:0 3px;min-height:20px;color:var(--mut)}
.hint{font-size:12px;color:var(--mut)}
.box{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
#stage{flex:1;position:relative;min-width:0;background:#fff}
#tools{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 16px)}
#tools button{box-shadow:0 1px 3px rgba(0,0,0,.12)}
#view{width:100%;height:100%;display:block;touch-action:none;background:#fff;cursor:default}
#status{position:absolute;left:8px;bottom:6px;font-size:12px;background:rgba(255,255,255,.88);padding:2px 8px;border-radius:6px;color:var(--mut);z-index:5;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:8px 14px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#sheetModal{position:fixed;inset:0;background:rgba(20,28,40,.78);z-index:40;display:none;flex-direction:column}
#sheetModal.on{display:flex}
#sheetModal .mbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--hd);align-items:center}
#sheetModal .mbar span{color:#fff;font-weight:700;margin-right:auto}
#sheetWrap{flex:1;overflow:auto;padding:12px;text-align:center}
#sheetWrap svg{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4);max-width:100%;height:auto}
#tramModal{position:fixed;inset:0;background:rgba(20,28,40,.78);z-index:41;display:none;flex-direction:column}
#tramModal.on{display:flex}
#tramModal .mbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--hd);align-items:center}
#tramModal .mbar span{color:#fff;font-weight:700;margin-right:auto}
#tramBody{flex:1;display:flex;min-height:0}
#tramPanel{width:390px;max-width:46vw;background:var(--pan);overflow:auto;padding:10px;flex:none}
#tramWrap{flex:1;overflow:auto;padding:12px;text-align:center}
.tpage{display:inline-block;margin:0 6px 12px;vertical-align:top}
.tpage svg{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4);width:100%;max-width:660px;height:auto;display:block}
@media (max-width:820px){
  #tramBody{flex-direction:column}
  #tramPanel{width:100%;max-width:none;max-height:42vh}
  .tpage{display:block}
}
@media (max-width:820px){
  header{gap:4px;padding:5px 6px}
  header h1 small{display:none}
  header button{padding:3px 8px;min-height:28px;font-size:13px}
  #tools button{padding:3px 8px;min-height:28px;font-size:13px}
  body{overflow:auto}
  main{flex-direction:column}
  #panel{width:100%;max-width:none;border-right:0;border-top:1px solid var(--line);order:2;min-height:60vh}
  #stage{order:1;height:52vh;flex:none}
  input,select,textarea{font-size:16px!important}
}
@media print{
  body.tramopen>*:not(#tramModal){display:none!important}
  #tramModal{position:static!important;display:block!important;background:none!important}
  #tramModal .mbar,#tramPanel{display:none!important}
  #tramBody{display:block!important}
  #tramWrap{overflow:visible!important;padding:0!important;text-align:left!important}
  .tpage{display:block!important;margin:0!important;height:330.1mm;overflow:hidden;break-after:page;page-break-after:always}
  .tpage:last-child{break-after:auto;page-break-after:auto}
  .tpage svg{width:215.9mm!important;height:330.1mm!important;max-width:none!important;box-shadow:none!important}
  body.sheetopen>*:not(#sheetModal){display:none!important}
  #sheetModal{position:static!important;display:block!important;background:none!important}
  #sheetModal .mbar{display:none!important}
  #sheetWrap{overflow:visible!important;padding:0!important}
  #sheetWrap svg{box-shadow:none!important;width:100%!important;height:auto!important;max-width:none!important}
  body{overflow:visible;display:block;background:#fff}
}
</style>
<style id="pagecss"></style>
</head>
<body>
<header>
  <h1>Modeler My ArQ<small>editor de planos</small></h1>
  <button id="bOpen" title="Abrir proyecto (.json), KML o CSV">Abrir…</button>
  <button id="bSave" class="pri" title="Guardar proyecto (.json)">Guardar</button>
  <button id="bUndo" title="Deshacer (Ctrl/Cmd+Z)">↶</button>
  <button id="bRedo" title="Rehacer (Ctrl/Cmd+Shift+Z)">↷</button>
  <button id="bNew" title="Proyecto nuevo">Nuevo</button>
  <span class="sp"></span>
  <button id="bTram" title="Plano de ubicación en formato de trámites (Oficio vertical)">PDF para trámites</button>
  <button id="bSheet" class="pri">Ver plano / Exportar</button>
  <input type="file" id="fileIn" accept=".json,.kml,.csv,.txt,application/json" hidden>
</header>
<main>
  <aside id="panel">
    <div id="tabs">
      <button data-tab="puntos" class="on">Puntos</button>
      <button data-tab="lotes">Lotes</button>
      <button data-tab="renum">Renumerar</button>
      <button data-tab="hoja">Hoja</button>
    </div>
    <section class="tab on" id="tab-puntos"></section>
    <section class="tab" id="tab-lotes"></section>
    <section class="tab" id="tab-renum"></section>
    <section class="tab" id="tab-hoja"></section>
  </aside>
  <div id="stage">
    <div id="tools">
      <button data-mode="mover" class="on" title="Seleccionar, arrastrar puntos y mover el plano">☝ Mover</button>
      <button data-mode="agregar" title="Toca el plano para agregar un punto">＋ Punto</button>
      <button data-mode="lote" title="Toca los puntos en orden para trazar un lote">⬠ Trazar lote</button>
      <button data-mode="fusionar" title="Toca un punto y luego otro: el segundo se fusiona en el primero">⧉ Fusionar</button>
      <button data-mode="medir" title="Toca dos puntos para medir distancia y azimut">📏 Medir</button>
      <button id="bFit" title="Ajustar vista">⤢</button>
      <button id="bZin">＋</button><button id="bZout">－</button>
    </div>
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="status"></div>
  </div>
</main>
<div id="sheetModal">
  <div class="mbar">
    <span>Plano completo</span>
    <button id="xPdf" class="pri">PDF (imprimir)</button>
    <button id="xTram">PDF para trámites</button>
    <button id="xPng">PNG</button>
    <button id="xSvg">SVG</button>
    <button id="xDxf">DXF</button>
    <button id="xKml">KML</button>
    <button id="xCsv">CSV</button>
    <button id="xJson">Proyecto .json</button>
    <button id="xClose">Cerrar</button>
  </div>
  <div id="sheetWrap"></div>
</div>
<div id="tramModal">
  <div class="mbar">
    <span>PDF para trámites · Plano de ubicación (Oficio)</span>
    <button id="tPdf" class="pri">PDF (imprimir)</button>
    <button id="tPng">PNG</button>
    <button id="tClose">Cerrar</button>
  </div>
  <div id="tramBody"><div id="tramPanel"></div><div id="tramWrap"></div></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Modeler My ArQ — editor de planos topográficos (GTM / WGS 84)
   Página independiente, sin dependencias. Todo corre en el navegador.
   ===================================================================== */

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v).trim().replace(',', '.')); return isFinite(x) ? x : NaN; };
const r2 = x => Math.round(x * 100) / 100;
function fmt(x, d = 2) {
  if (!isFinite(x)) return '—';
  const s = Math.abs(x).toFixed(d), [i, f] = s.split('.');
  return (x < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
}
const VARA2 = 0.698737;      // 1 vara² en m²
const MANZANA = 6987.37;     // 1 manzana = 10,000 varas² en m²

// ---------- proyección GTM (Transverse Mercator, WGS 84) ----------
const GTM = { a: 6378137, f: 1 / 298.257223563, lon0: -90.5, k0: 0.9998, fe: 500000, fn: 0 };
const TM = (() => {
  const n = GTM.f / (2 - GTM.f), n2 = n * n, n3 = n2 * n, n4 = n3 * n;
  return {
    n,
    A: GTM.a / (1 + n) * (1 + n2 / 4 + n4 / 64),
    al: [n / 2 - 2 * n2 / 3 + 5 * n3 / 16 + 41 * n4 / 180, 13 * n2 / 48 - 3 * n3 / 5 + 557 * n4 / 1440, 61 * n3 / 240 - 103 * n4 / 140, 49561 * n4 / 161280],
    be: [n / 2 - 2 * n2 / 3 + 37 * n3 / 96 - n4 / 360, n2 / 48 + n3 / 15 - 437 * n4 / 1440, 17 * n3 / 480 - 37 * n4 / 840, 4397 * n4 / 161280],
    de: [2 * n - 2 * n2 / 3 - 2 * n3 + 116 * n4 / 45, 7 * n2 / 3 - 8 * n3 / 5 - 227 * n4 / 45, 56 * n3 / 15 - 136 * n4 / 35, 4279 * n4 / 630]
  };
})();
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function lum(c) { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if (!m) return 0; const n = parseInt(m[1], 16); return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
const edgeCol = c => lum(c) > 0.82 ? '#6b6b6b' : c;
function dark(c, f = 0.62) { if (lum(c) > 0.82) return '#333'; const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if (!m) return '#222'; const n = parseInt(m[1], 16); return '#' + [16, 8, 0].map(sh => Math.round(((n >> sh) & 255) * f).toString(16).padStart(2, '0')).join(''); }
function llToGtm(lon, lat) {
  const n = TM.n, phi = rad(lat), lam = rad(lon - GTM.lon0), s = Math.sin(phi);
  const c = 2 * Math.sqrt(n) / (1 + n);
  const t = Math.sinh(Math.atanh(s) - c * Math.atanh(c * s));
  const xi0 = Math.atan2(t, Math.cos(lam)), eta0 = Math.atanh(Math.sin(lam) / Math.sqrt(1 + t * t));
  let xi = xi0, eta = eta0;
  for (let j = 1; j <= 4; j++) { xi += TM.al[j - 1] * Math.sin(2 * j * xi0) * Math.cosh(2 * j * eta0); eta += TM.al[j - 1] * Math.cos(2 * j * xi0) * Math.sinh(2 * j * eta0); }
  return [GTM.fe + GTM.k0 * TM.A * eta, GTM.fn + GTM.k0 * TM.A * xi];
}
function gtmToLl(e, nn) {
  const xi = (nn - GTM.fn) / (GTM.k0 * TM.A), eta = (e - GTM.fe) / (GTM.k0 * TM.A);
  let xi0 = xi, eta0 = eta;
  for (let j = 1; j <= 4; j++) { xi0 -= TM.be[j - 1] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); eta0 -= TM.be[j - 1] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); }
  const chi = Math.asin(Math.sin(xi0) / Math.cosh(eta0));
  let phi = chi; for (let j = 1; j <= 4; j++) phi += TM.de[j - 1] * Math.sin(2 * j * chi);
  const lam = Math.atan2(Math.sinh(eta0), Math.cos(xi0));
  return [GTM.lon0 + deg(lam), deg(phi)];
}

// ---------- geometría ----------
const sArea = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a.e * b.n - b.e * a.n; } return s / 2; };
const perim = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += Math.hypot(b.e - a.e, b.n - a.n); } return pts.length > 1 ? s : 0; };
function centroid(pts) {
  const a = sArea(pts); if (Math.abs(a) < 1e-9) return { e: pts.reduce((s, p) => s + p.e, 0) / (pts.length || 1), n: pts.reduce((s, p) => s + p.n, 0) / (pts.length || 1) };
  let cx = 0, cy = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], k = p.e * q.n - q.e * p.n; cx += (p.e + q.e) * k; cy += (p.n + q.n) * k; }
  return { e: cx / (6 * a), n: cy / (6 * a) };
}
const natKey = n => { const m = /^(\D*)(\d+)(.*)$/.exec(String(n)); return m ? [m[1], +m[2], m[3]] : [String(n), -1, '']; };
const natCmp = (a, b) => { const x = natKey(a.nombre), y = natKey(b.nombre); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1] || (x[2] < y[2] ? -1 : x[2] > y[2] ? 1 : 0); };
const dedupeRing = r => { const o = []; for (const id of r) if (o[o.length - 1] !== id) o.push(id); if (o.length > 1 && o[0] === o[o.length - 1]) o.pop(); return o; };

// ---------- modelo ----------
function tramDef() { return { lotes: null, propietario: '', ubicacion: '', naturaleza: 'Rústica', fecha: '', escala: 'auto', numeracion: 'cero', coordenadas: '', varas: false, colind: {} }; }
function emptyProject() {
  return { formato: 'modeler-my-arq', version: 1, nombre: 'Proyecto nuevo', crs: { tipo: 'GTM', datum: 'WGS84' }, puntos: [], lotes: [], nextId: 1, tramite: tramDef(),
    hoja: { titulo: 'PLANO', subtitulo: '', lugar: '', papel: 'tabloide', escala: 'auto', tablas: true, distancias: false, rejilla: true,
      nota: 'Plano de referencia: no sustituye un levantamiento topográfico firmado.' } };
}
function normalize(o) {
  const b = emptyProject(); const S = Object.assign(b, o || {});
  S.hoja = Object.assign(b.hoja, (o && o.hoja) || {});
  S.tramite = Object.assign(tramDef(), (o && o.tramite) || {}); S.tramite.colind = Object.assign({}, S.tramite.colind || {});
  S.puntos = (S.puntos || []).map(p => ({ id: +p.id, nombre: String(p.nombre), e: +p.e, n: +p.n, origen: p.origen || '', antes: p.antes || '', nota: p.nota || '', lab: p.lab == null || p.lab === '' ? null : +p.lab }));
  S.lotes = (S.lotes || []).map((l, i) => ({ id: String(l.id != null ? l.id : 'L' + (i + 1)), nombre: l.nombre || 'Lote ' + (i + 1), color: l.color || '#1b57e4', hatch: !!l.hatch, pts: (l.pts || []).map(Number), lx: l.lx == null ? null : +l.lx, ly: l.ly == null ? null : +l.ly, lrot: +l.lrot || 0 }));
  S.nextId = Math.max(S.nextId || 1, ...S.puntos.map(p => p.id + 1), 1);
  return S;
}
let S = emptyProject();
const ptMap = () => new Map(S.puntos.map(p => [p.id, p]));
const getP = id => S.puntos.find(p => p.id === id);
const ringPts = l => { const m = ptMap(); return l.pts.map(i => m.get(i)).filter(Boolean); };
const lotArea = l => Math.abs(sArea(ringPts(l)));
function usedIds() { const s = new Set(); S.lotes.forEach(l => l.pts.forEach(i => s.add(i))); return s; }
function nextName(prefix = 'P') {
  let mx = 0; S.puntos.forEach(p => { const m = /^P(\d+)$/.exec(p.nombre); if (m) mx = Math.max(mx, +m[1]); });
  return prefix + (mx + 1);
}
function uniqueName(base) { const names = new Set(S.puntos.map(p => p.nombre)); if (!names.has(base)) return base; let i = 2; while (names.has(base + '_' + i)) i++; return base + '_' + i; }
function addPoint(e, n, nombre, extra) { const p = Object.assign({ id: S.nextId++, nombre: nombre || nextName(), e: r2(e), n: r2(n), origen: '', antes: '', nota: '', lab: null }, extra || {}); S.puntos.push(p); return p; }
function mergePoints(keepId, dropId) {
  if (keepId === dropId) return;
  S.lotes.forEach(l => { l.pts = dedupeRing(l.pts.map(i => i === dropId ? keepId : i)); });
  S.puntos = S.puntos.filter(p => p.id !== dropId);
}
// Renombrar con reordenamiento automático: si el nuevo nombre (prefijo+número) ya lo usa otro punto,
// los demás se recorren para dejarle el lugar (como insertar en una lista). Devuelve cuántos cambiaron.
const LS_AUTO = 'modeler-my-arq:autoorden';
let autoOrden = (() => { try { return localStorage.getItem(LS_AUTO) !== '0'; } catch (e) { return true; } })();
function renameShift(p, v) {
  const old = p.nombre, a = natKey(old), b = natKey(v), pure = k => k[1] >= 0 && k[2] === '';
  p.nombre = v;
  if (!autoOrden || !pure(b)) return 0;
  const pre = b[0], N = b[1], num = q => { const k = natKey(q.nombre); return pure(k) && k[0] === pre ? k[1] : null; };
  const others = S.puntos.filter(q => q !== p && num(q) != null);
  if (!others.some(q => num(q) === N)) return 0;
  const moves = [];
  if (pure(a) && a[0] === pre && a[1] < N) {
    others.filter(q => num(q) > a[1] && num(q) <= N).forEach(q => moves.push([q, num(q) - 1]));   // sube el número: los intermedios bajan
  } else {
    let cur = N; for (;;) { const q = others.find(x => num(x) === cur); if (!q) break; moves.push([q, cur + 1]); cur++; }   // inserta: los siguientes suben hasta el primer hueco
  }
  moves.forEach(([q, n]) => { q.antes = q.nombre; q.nombre = pre + n; });
  return moves.length;
}
function deletePoint(id) { S.lotes.forEach(l => { l.pts = l.pts.filter(i => i !== id); }); S.puntos = S.puntos.filter(p => p.id !== id); }

// aristas compartidas / perímetro exterior
function boundaryCycle(startId, cw) {
  const key = (a, b) => a < b ? a + '-' + b : b + '-' + a, cnt = new Map(), adj = new Map();
