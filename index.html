<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<title>Modeler My ArQ · editor de planos</title>
<style>
:root{--bg:#eef0f3;--pan:#fff;--ink:#1c2430;--mut:#667085;--line:#d8dce3;--acc:#1b57e4;--acc2:#e8eefc;--red:#c0392b;--hd:#1b2a41}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
header h1 small{font-weight:400;opacity:.65;margin-left:6px}
header .sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;min-height:30px}
button:hover{border-color:#aab3c2}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--red)}
button:disabled{opacity:.4;cursor:default}
header button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
header button:hover{background:rgba(255,255,255,.2)}
header button.pri{background:var(--acc);border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
#panel{width:390px;max-width:46vw;background:var(--pan);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;background:none;padding:9px 4px;font-weight:600;color:var(--mut)}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--acc2)}
.tab{display:none;overflow:auto;padding:10px;flex:1;min-height:0}
.tab.on{display:block}
h3{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
th{font-size:11px;color:var(--mut);text-align:left;padding:2px 3px;font-weight:600}
td{padding:2px 2px}
tr.sel td{background:var(--acc2)}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;width:100%;background:#fff}
input.n{text-align:right;font-variant-numeric:tabular-nums}
input.nm{font-weight:700;min-width:52px}
input[type=color]{width:34px;height:30px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff}
input[type=checkbox]{width:auto;min-height:0}
button.x{padding:2px 8px;min-height:28px;color:var(--red)}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label{font-size:12px;color:var(--mut)}
.lot{border:1px solid var(--line);border-radius:9px;padding:8px;margin:8px 0}
.lot.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.lot .stats{font-size:12px;color:var(--mut);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:14px;padding:1px 4px 1px 8px;background:#fafbfc;font-weight:600;font-size:12px}
.chip button{border:0;background:none;padding:0 3px;min-height:20px;color:var(--mut)}
.hint{font-size:12px;color:var(--mut)}
.box{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
#stage{flex:1;position:relative;min-width:0;background:#fff}
#tools{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 16px)}
#tools button{box-shadow:0 1px 3px rgba(0,0,0,.12)}
#view{width:100%;height:100%;display:block;touch-action:none;background:#fff;cursor:default}
#status{position:absolute;left:8px;bottom:6px;font-size:12px;background:rgba(255,255,255,.88);padding:2px 8px;border-radius:6px;color:var(--mut);z-index:5;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:8px 14px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#sheetModal{position:fixed;inset:0;background:rgba(20,28,40,.78);z-index:40;display:none;flex-direction:column}
#sheetModal.on{display:flex}
#sheetModal .mbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--hd);align-items:center}
#sheetModal .mbar span{color:#fff;font-weight:700;margin-right:auto}
#sheetWrap{flex:1;overflow:auto;padding:12px;text-align:center}
#sheetWrap svg{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4);max-width:100%;height:auto}
@media (max-width:820px){
  header{gap:4px;padding:5px 6px}
  header h1 small{display:none}
  header button{padding:3px 8px;min-height:28px;font-size:13px}
  #tools button{padding:3px 8px;min-height:28px;font-size:13px}
  body{overflow:auto}
  main{flex-direction:column}
  #panel{width:100%;max-width:none;border-right:0;border-top:1px solid var(--line);order:2;min-height:60vh}
  #stage{order:1;height:52vh;flex:none}
  input,select,textarea{font-size:16px!important}
}
@media print{
  body.sheetopen>*:not(#sheetModal){display:none!important}
  #sheetModal{position:static!important;display:block!important;background:none!important}
  #sheetModal .mbar{display:none!important}
  #sheetWrap{overflow:visible!important;padding:0!important}
  #sheetWrap svg{box-shadow:none!important;width:100%!important;height:auto!important;max-width:none!important}
  body{overflow:visible;display:block;background:#fff}
}
</style>
<style id="pagecss"></style>
</head>
<body>
<header>
  <h1>Modeler My ArQ<small>editor de planos</small></h1>
  <button id="bOpen" title="Abrir proyecto (.json), KML o CSV">Abrir…</button>
  <button id="bSave" class="pri" title="Guardar proyecto (.json)">Guardar</button>
  <button id="bUndo" title="Deshacer (Ctrl/Cmd+Z)">↶</button>
  <button id="bRedo" title="Rehacer (Ctrl/Cmd+Shift+Z)">↷</button>
  <button id="bNew" title="Proyecto nuevo">Nuevo</button>
  <span class="sp"></span>
  <button id="bSheet" class="pri">Ver plano / Exportar</button>
  <input type="file" id="fileIn" accept=".json,.kml,.csv,.txt,application/json" hidden>
</header>
<main>
  <aside id="panel">
    <div id="tabs">
      <button data-tab="puntos" class="on">Puntos</button>
      <button data-tab="lotes">Lotes</button>
      <button data-tab="renum">Renumerar</button>
      <button data-tab="hoja">Hoja</button>
    </div>
    <section class="tab on" id="tab-puntos"></section>
    <section class="tab" id="tab-lotes"></section>
    <section class="tab" id="tab-renum"></section>
    <section class="tab" id="tab-hoja"></section>
  </aside>
  <div id="stage">
    <div id="tools">
      <button data-mode="mover" class="on" title="Seleccionar, arrastrar puntos y mover el plano">☝ Mover</button>
      <button data-mode="agregar" title="Toca el plano para agregar un punto">＋ Punto</button>
      <button data-mode="lote" title="Toca los puntos en orden para trazar un lote">⬠ Trazar lote</button>
      <button data-mode="fusionar" title="Toca un punto y luego otro: el segundo se fusiona en el primero">⧉ Fusionar</button>
      <button data-mode="medir" title="Toca dos puntos para medir distancia y azimut">📏 Medir</button>
      <button id="bFit" title="Ajustar vista">⤢</button>
      <button id="bZin">＋</button><button id="bZout">－</button>
    </div>
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="status"></div>
  </div>
</main>
<div id="sheetModal">
  <div class="mbar">
    <span>Plano completo</span>
    <button id="xPdf" class="pri">PDF (imprimir)</button>
    <button id="xPng">PNG</button>
    <button id="xSvg">SVG</button>
    <button id="xDxf">DXF</button>
    <button id="xKml">KML</button>
    <button id="xCsv">CSV</button>
    <button id="xJson">Proyecto .json</button>
    <button id="xClose">Cerrar</button>
  </div>
  <div id="sheetWrap"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Modeler My ArQ — editor de planos topográficos (GTM / WGS 84)
   Página independiente, sin dependencias. Todo corre en el navegador.
   ===================================================================== */

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v).trim().replace(',', '.')); return isFinite(x) ? x : NaN; };
const r2 = x => Math.round(x * 100) / 100;
function fmt(x, d = 2) {
  if (!isFinite(x)) return '—';
  const s = Math.abs(x).toFixed(d), [i, f] = s.split('.');
  return (x < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
}
const VARA2 = 0.698737;      // 1 vara² en m²
const MANZANA = 6987.37;     // 1 manzana = 10,000 varas² en m²

// ---------- proyección GTM (Transverse Mercator, WGS 84) ----------
const GTM = { a: 6378137, f: 1 / 298.257223563, lon0: -90.5, k0: 0.9998, fe: 500000, fn: 0 };
const TM = (() => {
  const n = GTM.f / (2 - GTM.f), n2 = n * n, n3 = n2 * n, n4 = n3 * n;
  return {
    n,
    A: GTM.a / (1 + n) * (1 + n2 / 4 + n4 / 64),
    al: [n / 2 - 2 * n2 / 3 + 5 * n3 / 16 + 41 * n4 / 180, 13 * n2 / 48 - 3 * n3 / 5 + 557 * n4 / 1440, 61 * n3 / 240 - 103 * n4 / 140, 49561 * n4 / 161280],
    be: [n / 2 - 2 * n2 / 3 + 37 * n3 / 96 - n4 / 360, n2 / 48 + n3 / 15 - 437 * n4 / 1440, 17 * n3 / 480 - 37 * n4 / 840, 4397 * n4 / 161280],
    de: [2 * n - 2 * n2 / 3 - 2 * n3 + 116 * n4 / 45, 7 * n2 / 3 - 8 * n3 / 5 - 227 * n4 / 45, 56 * n3 / 15 - 136 * n4 / 35, 4279 * n4 / 630]
  };
})();
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dark(c, f = 0.62) { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if (!m) return '#222'; const n = parseInt(m[1], 16); return '#' + [16, 8, 0].map(sh => Math.round(((n >> sh) & 255) * f).toString(16).padStart(2, '0')).join(''); }
function llToGtm(lon, lat) {
  const n = TM.n, phi = rad(lat), lam = rad(lon - GTM.lon0), s = Math.sin(phi);
  const c = 2 * Math.sqrt(n) / (1 + n);
  const t = Math.sinh(Math.atanh(s) - c * Math.atanh(c * s));
  const xi0 = Math.atan2(t, Math.cos(lam)), eta0 = Math.atanh(Math.sin(lam) / Math.sqrt(1 + t * t));
  let xi = xi0, eta = eta0;
  for (let j = 1; j <= 4; j++) { xi += TM.al[j - 1] * Math.sin(2 * j * xi0) * Math.cosh(2 * j * eta0); eta += TM.al[j - 1] * Math.cos(2 * j * xi0) * Math.sinh(2 * j * eta0); }
  return [GTM.fe + GTM.k0 * TM.A * eta, GTM.fn + GTM.k0 * TM.A * xi];
}
function gtmToLl(e, nn) {
  const xi = (nn - GTM.fn) / (GTM.k0 * TM.A), eta = (e - GTM.fe) / (GTM.k0 * TM.A);
  let xi0 = xi, eta0 = eta;
  for (let j = 1; j <= 4; j++) { xi0 -= TM.be[j - 1] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); eta0 -= TM.be[j - 1] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); }
  const chi = Math.asin(Math.sin(xi0) / Math.cosh(eta0));
  let phi = chi; for (let j = 1; j <= 4; j++) phi += TM.de[j - 1] * Math.sin(2 * j * chi);
  const lam = Math.atan2(Math.sinh(eta0), Math.cos(xi0));
  return [GTM.lon0 + deg(lam), deg(phi)];
}

// ---------- geometría ----------
const sArea = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a.e * b.n - b.e * a.n; } return s / 2; };
const perim = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += Math.hypot(b.e - a.e, b.n - a.n); } return pts.length > 1 ? s : 0; };
function centroid(pts) {
  const a = sArea(pts); if (Math.abs(a) < 1e-9) return { e: pts.reduce((s, p) => s + p.e, 0) / (pts.length || 1), n: pts.reduce((s, p) => s + p.n, 0) / (pts.length || 1) };
  let cx = 0, cy = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], k = p.e * q.n - q.e * p.n; cx += (p.e + q.e) * k; cy += (p.n + q.n) * k; }
  return { e: cx / (6 * a), n: cy / (6 * a) };
}
const natKey = n => { const m = /^(\D*)(\d+)(.*)$/.exec(String(n)); return m ? [m[1], +m[2], m[3]] : [String(n), -1, '']; };
const natCmp = (a, b) => { const x = natKey(a.nombre), y = natKey(b.nombre); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1] || (x[2] < y[2] ? -1 : x[2] > y[2] ? 1 : 0); };
const dedupeRing = r => { const o = []; for (const id of r) if (o[o.length - 1] !== id) o.push(id); if (o.length > 1 && o[0] === o[o.length - 1]) o.pop(); return o; };

// ---------- modelo ----------
function emptyProject() {
  return { formato: 'modeler-my-arq', version: 1, nombre: 'Proyecto nuevo', crs: { tipo: 'GTM', datum: 'WGS84' }, puntos: [], lotes: [], nextId: 1,
    hoja: { titulo: 'PLANO', subtitulo: '', lugar: '', papel: 'tabloide', escala: 'auto', tablas: true, distancias: false, rejilla: true,
      nota: 'Plano de referencia: no sustituye un levantamiento topográfico firmado.' } };
}
function normalize(o) {
  const b = emptyProject(); const S = Object.assign(b, o || {});
  S.hoja = Object.assign(b.hoja, (o && o.hoja) || {});
  S.puntos = (S.puntos || []).map(p => ({ id: +p.id, nombre: String(p.nombre), e: +p.e, n: +p.n, origen: p.origen || '', antes: p.antes || '', nota: p.nota || '', lab: p.lab == null || p.lab === '' ? null : +p.lab }));
  S.lotes = (S.lotes || []).map((l, i) => ({ id: String(l.id != null ? l.id : 'L' + (i + 1)), nombre: l.nombre || 'Lote ' + (i + 1), color: l.color || '#1b57e4', hatch: !!l.hatch, pts: (l.pts || []).map(Number), lx: l.lx == null ? null : +l.lx, ly: l.ly == null ? null : +l.ly, lrot: +l.lrot || 0 }));
  S.nextId = Math.max(S.nextId || 1, ...S.puntos.map(p => p.id + 1), 1);
  return S;
}
let S = emptyProject();
const ptMap = () => new Map(S.puntos.map(p => [p.id, p]));
const getP = id => S.puntos.find(p => p.id === id);
const ringPts = l => { const m = ptMap(); return l.pts.map(i => m.get(i)).filter(Boolean); };
const lotArea = l => Math.abs(sArea(ringPts(l)));
function usedIds() { const s = new Set(); S.lotes.forEach(l => l.pts.forEach(i => s.add(i))); return s; }
function nextName(prefix = 'P') {
  let mx = 0; S.puntos.forEach(p => { const m = /^P(\d+)$/.exec(p.nombre); if (m) mx = Math.max(mx, +m[1]); });
  return prefix + (mx + 1);
}
function uniqueName(base) { const names = new Set(S.puntos.map(p => p.nombre)); if (!names.has(base)) return base; let i = 2; while (names.has(base + '_' + i)) i++; return base + '_' + i; }
function addPoint(e, n, nombre, extra) { const p = Object.assign({ id: S.nextId++, nombre: nombre || nextName(), e: r2(e), n: r2(n), origen: '', antes: '', nota: '', lab: null }, extra || {}); S.puntos.push(p); return p; }
function mergePoints(keepId, dropId) {
  if (keepId === dropId) return;
  S.lotes.forEach(l => { l.pts = dedupeRing(l.pts.map(i => i === dropId ? keepId : i)); });
  S.puntos = S.puntos.filter(p => p.id !== dropId);
}
function deletePoint(id) { S.lotes.forEach(l => { l.pts = l.pts.filter(i => i !== id); }); S.puntos = S.puntos.filter(p => p.id !== id); }

// aristas compartidas / perímetro exterior
function boundaryCycle(startId, cw) {
  const key = (a, b) => a < b ? a + '-' + b : b + '-' + a, cnt = new Map(), adj = new Map();
  for (const l of S.lotes) { const r = l.pts; for (let i = 0; i < r.length; i++) { const a = r[i], b = r[(i + 1) % r.length]; if (a === b) continue; cnt.set(key(a, b), (cnt.get(key(a, b)) || 0) + 1); } }
  for (const l of S.lotes) { const r = l.pts; for (let i = 0; i < r.length; i++) { const a = r[i], b = r[(i + 1) % r.length]; if (a === b || cnt.get(key(a, b)) !== 1) continue; if (!adj.has(a)) adj.set(a, []); if (!adj.has(b)) adj.set(b, []); adj.get(a).push(b); adj.get(b).push(a); } }
  if (!adj.size) return [];
  const start = startId != null && adj.has(startId) ? startId : Math.min(...adj.keys());
  const cyc = [start]; let prev = null, cur = start;
  for (let g = 0; g < 100000; g++) {
    const nb = adj.get(cur).filter(x => x !== prev);
    const nxt = prev === null ? adj.get(cur)[0] : nb[0];
    if (nxt == null || nxt === start) break;
    if (cyc.includes(nxt)) break;
    cyc.push(nxt); prev = cur; cur = nxt;
  }
  const m = ptMap(), sa = sArea(cyc.map(i => m.get(i)));
  if ((cw && sa > 0) || (!cw && sa < 0)) return [cyc[0], ...cyc.slice(1).reverse()];
  return cyc;
}
function uniqueEdges() {
  const key = (a, b) => a < b ? a + '-' + b : b + '-' + a, seen = new Set(), out = [], m = ptMap();
  for (const l of S.lotes) for (let i = 0; i < l.pts.length; i++) {
    const a = l.pts[i], b = l.pts[(i + 1) % l.pts.length]; if (a === b || seen.has(key(a, b))) continue; seen.add(key(a, b));
    const pa = m.get(a), pb = m.get(b); if (pa && pb) out.push({ a: pa, b: pb, d: Math.hypot(pb.e - pa.e, pb.n - pa.n) });
  }
  return out;
}
function computeRenumber(startId, cw, prefix = 'P') {
  const cyc = boundaryCycle(startId, cw), used = usedIds(), m = ptMap(), inC = new Set(cyc);
  let rest = [...used].filter(i => !inC.has(i) && m.has(i));
  if (cyc.length) {
    const cx = cyc.reduce((s, i) => s + m.get(i).e, 0) / cyc.length, cy = cyc.reduce((s, i) => s + m.get(i).n, 0) / cyc.length;
    const a0 = Math.atan2(m.get(cyc[0]).n - cy, m.get(cyc[0]).e - cx);
    const key = i => { let d = Math.atan2(m.get(i).n - cy, m.get(i).e - cx) - a0; if (cw) d = -d; return ((d % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); };
    rest.sort((a, b) => key(a) - key(b));
  }
  const unused = S.puntos.filter(p => !used.has(p.id)).sort(natCmp).map(p => p.id);
  const order = [...cyc, ...rest, ...unused];
  return order.map((id, i) => ({ id, viejo: m.get(id).nombre, nuevo: prefix + (i + 1), exterior: inC.has(id) }));
}

// ---------- historial / guardado ----------
const hist = { u: [], r: [] };
function snapshot() { hist.u.push(JSON.stringify(S)); if (hist.u.length > 200) hist.u.shift(); hist.r.length = 0; updUndo(); }
function undo() { if (!hist.u.length) return; hist.r.push(JSON.stringify(S)); S = normalize(JSON.parse(hist.u.pop())); afterChange(true); }
function redo() { if (!hist.r.length) return; hist.u.push(JSON.stringify(S)); S = normalize(JSON.parse(hist.r.pop())); afterChange(true); }
function updUndo() { const u = $('#bUndo'), r = $('#bRedo'); if (u) { u.disabled = !hist.u.length; r.disabled = !hist.r.length; } }
const LS = 'modeler-my-arq:proyecto:v1';
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ } }
function afterChange(keepSel) {
  if (!keepSel) { /* nada */ }
  if (sel.pt != null && !getP(sel.pt)) sel.pt = null;
  if (sel.lot != null && !S.lotes.find(l => l.id === sel.lot)) sel.lot = null;
  persist(); renderAll(); updUndo();
}
function mutate(fn) { snapshot(); fn(); afterChange(); }

// ---------- estado de la interfaz ----------
const sel = { pt: null, lot: null };
let mode = 'mover', pendingMerge = null, pendingMeasure = null, activeTab = 'puntos';
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- vista del plano ----------
const V = { cx: 0, cy: 0, k: 1, w: 800, h: 600 };
const w2s = (e, n) => [(e - V.cx) * V.k + V.w / 2, -(n - V.cy) * V.k + V.h / 2];
const s2w = (x, y) => [(x - V.w / 2) / V.k + V.cx, -(y - V.h / 2) / V.k + V.cy];
function bbox(list) {
  const ps = list || S.puntos; if (!ps.length) return null;
  return { e0: Math.min(...ps.map(p => p.e)), e1: Math.max(...ps.map(p => p.e)), n0: Math.min(...ps.map(p => p.n)), n1: Math.max(...ps.map(p => p.n)) };
}
function fitView() {
  const r = $('#view').getBoundingClientRect(); V.w = r.width || 800; V.h = r.height || 600;
  const b = bbox(); if (!b) { V.cx = 0; V.cy = 0; V.k = 4; return; }
  const w = Math.max(b.e1 - b.e0, 5), h = Math.max(b.n1 - b.n0, 5);
  V.k = Math.min((V.w - 90) / w, (V.h - 110) / h); V.cx = (b.e0 + b.e1) / 2; V.cy = (b.n0 + b.n1) / 2;
}
function niceStep(minM) { for (const m of [.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000]) if (m >= minM) return m; return 10000; }
function drawCanvas() {
  const svg = $('#view'), out = [];
  const r = svg.getBoundingClientRect(); V.w = r.width || V.w; V.h = r.height || V.h;
  // rejilla
  if (S.hoja.rejilla) {
    const step = niceStep(70 / V.k), [e0, n1] = s2w(0, 0), [e1, n0] = s2w(V.w, V.h);
    for (let e = Math.ceil(e0 / step) * step; e <= e1; e += step) { const x = w2s(e, 0)[0]; out.push(`<line x1="${x}" y1="0" x2="${x}" y2="${V.h}" stroke="#e6e9ee"/><text x="${x + 3}" y="${V.h - 22}" font-size="10" fill="#98a2b3">${Math.round(e)}</text>`); }
    for (let n = Math.ceil(n0 / step) * step; n <= n1; n += step) { const y = w2s(0, n)[1]; out.push(`<line x1="0" y1="${y}" x2="${V.w}" y2="${y}" stroke="#e6e9ee"/><text x="3" y="${y - 3}" font-size="10" fill="#98a2b3">${Math.round(n)}</text>`); }
  }
  const m = ptMap();
  for (const l of S.lotes) {
    const ps = l.pts.map(i => m.get(i)).filter(Boolean); if (ps.length < 2) continue;
    const d = ps.map(p => w2s(p.e, p.n).map(v => v.toFixed(1)).join(',')).join(' ');
    out.push(`<polygon data-lot="${esc(l.id)}" points="${d}" fill="${l.color}" fill-opacity="${l.hatch ? .34 : .2}" stroke="${l.color}" stroke-width="${sel.lot === l.id ? 3.2 : 1.8}" stroke-linejoin="round"/>`);
  }
  const cyc = boundaryCycle(null, true);
  if (cyc.length > 2) out.push(`<polygon points="${cyc.map(i => w2s(m.get(i).e, m.get(i).n).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#111" stroke-width="2" pointer-events="none"/>`);
  if (S.hoja.distancias) for (const ed of uniqueEdges()) {
    const [x1, y1] = w2s(ed.a.e, ed.a.n), [x2, y2] = w2s(ed.b.e, ed.b.n); let ang = deg(Math.atan2(y2 - y1, x2 - x1)); if (ang > 90 || ang < -90) ang += 180;
    out.push(`<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 3}" font-size="10" text-anchor="middle" fill="#344054" transform="rotate(${ang.toFixed(1)} ${(x1 + x2) / 2} ${(y1 + y2) / 2})" pointer-events="none">${ed.d.toFixed(2)}</text>`);
  }
  for (const l of S.lotes) {
    const ps = ringPts(l); if (ps.length < 3) continue;
    const c = l.lx != null && l.ly != null ? { e: l.lx, n: l.ly } : centroid(ps), [x, y] = w2s(c.e, c.n);
    out.push(`<text x="${x}" y="${y}" text-anchor="middle" font-size="12" font-weight="700" fill="${dark(l.color)}" paint-order="stroke" stroke="#fff" stroke-width="3" transform="rotate(${-(l.lrot || 0)} ${x} ${y})" pointer-events="none"><tspan x="${x}" dy="-2">${esc(l.nombre)}</tspan><tspan x="${x}" dy="14" font-weight="400">${fmt(lotArea(l))} m²</tspan></text>`);
  }
  if (mode === 'lote' && sel.lot) {
    const l = S.lotes.find(q => q.id === sel.lot), ps = l ? ringPts(l) : [];
    if (ps.length > 1) out.push(`<polyline points="${ps.map(p => w2s(p.e, p.n).join(',')).join(' ')}" fill="none" stroke="${l.color}" stroke-width="3" stroke-dasharray="6 4" pointer-events="none"/>`);
  }
  for (const p of S.puntos) {
    const [x, y] = w2s(p.e, p.n), isSel = sel.pt === p.id, pm = pendingMerge === p.id || pendingMeasure === p.id;
    out.push(`<g data-pt="${p.id}" style="cursor:${mode === 'mover' ? 'grab' : 'pointer'}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="${isSel || pm ? 6 : 4}" fill="${pm ? '#f79009' : isSel ? '#1b57e4' : '#111'}" stroke="#fff" stroke-width="1.5"/><text x="${x + 7}" y="${y - 7}" font-size="12" font-weight="700" fill="${isSel ? '#1b57e4' : '#111'}" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(p.nombre)}</text></g>`);
  }
  svg.innerHTML = out.join('');
}

// ---------- interacción en el plano ----------
const view = $('#view'), ptrs = new Map();
let drag = null, pinch = null;
function localXY(ev) { const r = view.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
function setMode(m) {
  mode = m; pendingMerge = null; pendingMeasure = null;
  $$('#tools [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  const h = { mover: 'Arrastra un punto para moverlo; arrastra el fondo para desplazar; rueda o pellizco para acercar.', agregar: 'Toca el plano para agregar un punto.', lote: 'Toca los puntos en orden. Toca el primero de nuevo (o Esc) para cerrar el lote.', fusionar: 'Toca el punto que se conserva y luego el que se fusiona en él.', medir: 'Toca dos puntos para medir distancia y azimut.' };
  $('#status').textContent = h[m]; view.style.cursor = m === 'agregar' ? 'crosshair' : 'default'; drawCanvas();
}
view.addEventListener('pointerdown', ev => {
  view.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; return; }
  const [x, y] = localXY(ev), g = ev.target.closest && ev.target.closest('[data-pt]'), pl = ev.target.closest && ev.target.closest('[data-lot]');
  drag = { sx: x, sy: y, cx: V.cx, cy: V.cy, moved: false, pt: g ? +g.dataset.pt : null, lot: pl ? pl.dataset.lot : null, moving: false };
  if (mode === 'mover' && drag.pt != null) { snapshot(); selectPoint(drag.pt); drag.moving = true; }
});
view.addEventListener('pointermove', ev => {
  const [x, y] = localXY(ev), [e, n] = s2w(x, y); $('#status').dataset.xy = `E ${e.toFixed(2)}  N ${n.toFixed(2)}`;
  if (!ptrs.has(ev.pointerId)) { if (!drag) $('#status').textContent = `E ${e.toFixed(2)}   N ${n.toFixed(2)}   ·   modo: ${mode}`; return; }
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch.d > 0) { V.k = Math.min(Math.max(V.k * d / pinch.d, 0.05), 400); drawCanvas(); } pinch.d = d; return;
  }
  if (!drag) return;
  if (Math.hypot(x - drag.sx, y - drag.sy) > 4) drag.moved = true;
  if (!drag.moved) return;
  if (drag.moving) {
    const p = getP(drag.pt); if (p) { p.e = r2(e); p.n = r2(n); drawCanvas(); syncRow(p); }
  } else if (mode === 'mover' || drag.pt == null) { V.cx = drag.cx - (x - drag.sx) / V.k; V.cy = drag.cy + (y - drag.sy) / V.k; drawCanvas(); }
});
function endPtr(ev) {
  ptrs.delete(ev.pointerId); if (ptrs.size < 2) pinch = null;
  if (!drag) return; const d = drag; drag = null;
  if (d.moving && d.moved) { persist(); renderAll(); return; }
  if (d.moved) return;
  const [x, y] = localXY(ev), [e, n] = s2w(x, y);
  if (mode === 'agregar') { mutate(() => { const p = addPoint(e, n); sel.pt = p.id; }); toast(`Punto ${getP(sel.pt).nombre} agregado`); }
  else if (mode === 'lote' && d.pt != null) clickLotPoint(d.pt);
  else if (mode === 'fusionar' && d.pt != null) clickMerge(d.pt);
  else if (mode === 'medir' && d.pt != null) clickMeasure(d.pt);
  else if (mode === 'mover') { if (d.pt != null) selectPoint(d.pt); else if (d.lot) { sel.lot = d.lot; sel.pt = null; renderAll(); setTab('lotes'); } else { sel.pt = null; sel.lot = null; renderAll(); } }
}
view.addEventListener('pointerup', endPtr); view.addEventListener('pointercancel', endPtr);
view.addEventListener('wheel', ev => {
  ev.preventDefault(); const [x, y] = localXY(ev), [e, n] = s2w(x, y);
  V.k = Math.min(Math.max(V.k * Math.pow(1.0018, -ev.deltaY), 0.05), 400);
  V.cx = e - (x - V.w / 2) / V.k; V.cy = n + (y - V.h / 2) / V.k; drawCanvas();
}, { passive: false });
view.addEventListener('dblclick', ev => { if (mode === 'lote') finishLot(); });
function clickLotPoint(id) {
  let l = S.lotes.find(q => q.id === sel.lot);
  if (!l) { snapshot(); l = newLot(); S.lotes.push(l); sel.lot = l.id; }
  else if (l.pts.length >= 3 && l.pts[0] === id) { finishLot(); return; }
  else snapshot();
  if (l.pts[l.pts.length - 1] !== id) l.pts.push(id);
  afterChange();
}
function finishLot() { setMode('mover'); toast('Lote cerrado'); renderAll(); }
function clickMerge(id) {
  if (pendingMerge == null) { pendingMerge = id; toast(`Se conserva ${getP(id).nombre}. Toca el punto a fusionar.`); drawCanvas(); return; }
  if (pendingMerge === id) { pendingMerge = null; drawCanvas(); return; }
  const keep = getP(pendingMerge), drop = getP(id); pendingMerge = null;
  mutate(() => { mergePoints(keep.id, drop.id); sel.pt = keep.id; });
  toast(`${drop.nombre} fusionado en ${keep.nombre}`);
}
function clickMeasure(id) {
  if (pendingMeasure == null) { pendingMeasure = id; drawCanvas(); return; }
  const a = getP(pendingMeasure), b = getP(id); pendingMeasure = null; drawCanvas();
  if (!a || !b || a === b) return;
  const dd = Math.hypot(b.e - a.e, b.n - a.n); let az = deg(Math.atan2(b.e - a.e, b.n - a.n)); if (az < 0) az += 360;
  toast(`${a.nombre} → ${b.nombre}: ${dd.toFixed(2)} m · azimut ${az.toFixed(2)}°`);
}
function selectPoint(id) {
  sel.pt = id; drawCanvas();
  $$('#tab-puntos tr[data-id]').forEach(r => r.classList.toggle('sel', +r.dataset.id === id));
  renderPtDetail(); const row = $(`#tab-puntos tr[data-id="${id}"]`); if (row && activeTab === 'puntos') row.scrollIntoView({ block: 'nearest' });
}
function syncRow(p) { const r = $(`#tab-puntos tr[data-id="${p.id}"]`); if (!r) return; const i = $$('input', r); if (i[1]) i[1].value = p.e.toFixed(2); if (i[2]) i[2].value = p.n.toFixed(2); }

// ---------- paneles ----------
function setTab(t) { activeTab = t; $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); $$('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t)); }
function renderPoints() {
  const el = $('#tab-puntos'), rows = [...S.puntos].sort(natCmp).map(p => `<tr data-id="${p.id}" class="${sel.pt === p.id ? 'sel' : ''}"><td style="width:27%"><input class="nm" data-f="nombre" value="${esc(p.nombre)}"></td><td><input class="n" data-f="e" inputmode="decimal" value="${p.e.toFixed(2)}"></td><td><input class="n" data-f="n" inputmode="decimal" value="${p.n.toFixed(2)}"></td><td style="width:34px"><button class="x" data-act="delpt" title="Eliminar punto">✕</button></td></tr>`).join('');
  el.innerHTML = `<h3>Puntos medidos (${S.puntos.length})</h3>

  <table><thead><tr><th>Nombre</th><th>Este</th><th>Norte</th><th></th></tr></thead><tbody>${rows}</tbody></table>

function renderPtDetail() {

  <div class="row"><label style="width:62px">Etiqueta °</label><input data-d="lab" type="number" step="5" placeholder="auto" value="${p.lab == null ? '' : p.lab}" style="width:90px"><span class="hint">0 = este, 90 = norte</span></div>

function newLot() { let i = 1; while (S.lotes.some(l => l.id === 'L' + i)) i++; const cols = ['#c0392b', '#2e6da4', '#1e8449', '#b9770e', '#8e44ad', '#117a8b']; return { id: 'L' + i, nombre: 'Lote ' + i, color: cols[(i - 1) % cols.length], hatch: false, pts: [], lx: null, ly: null, lrot: 0 }; }
function lotStats(l) {
  const ps = ringPts(l), a = Math.abs(sArea(ps)), pr = perim(ps);
  return `${fmt(a)} m² · ${fmt(a / VARA2, 0)} varas² · ${(a / MANZANA).toFixed(3)} mz · perím. ${fmt(pr)} m`;

// ---------- eventos de paneles ----------
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'), tab = ev.target.closest('#tabs [data-tab]'), md = ev.target.closest('#tools [data-mode]');
  if (tab) { setTab(tab.dataset.tab); return; }
  if (md) { setMode(md.dataset.mode); return; }
  const row = ev.target.closest('#tab-puntos tr[data-id]'); if (row && !t) selectPoint(+row.dataset.id);
  const lotEl = ev.target.closest('.lot'); if (lotEl && !t && !ev.target.closest('input,select,button,textarea') && sel.lot !== lotEl.dataset.lot) { sel.lot = lotEl.dataset.lot; renderLots(); drawCanvas(); }

    T(cx[0], y, 'PTO', fs, { w: 700 }); T(cx[1], y, 'ESTE', fs, { w: 700, anchor: 'end' }); T(cx[2], y, 'NORTE', fs, { w: 700, anchor: 'end' }); T(cx[3], y, 'ORIGEN', fs, { w: 700 }); y += rh;
    rows.forEach(p => { T(cx[0], y, p.nombre, fs); T(cx[1], y, p.e.toFixed(2), fs, { anchor: 'end' }); T(cx[2], y, p.n.toFixed(2), fs, { anchor: 'end' }); T(cx[3], y, (p.origen || '').slice(0, 34), fs * 0.8, { fill: '#444' }); y += rh; });
    y += 4; T(tx, y, 'CUADRO DE LOTES', hs, { w: 700 }); y += 5.5;
    const wrap = (txt, n) => { const w = txt.split('-'), L = []; let cur = ''; w.forEach(s => { if ((cur + '-' + s).length > n && cur) { L.push(cur); cur = s; } else cur = cur ? cur + '-' + s : s; }); if (cur) L.push(cur); return L; };
    for (const l of S.lotes) { const a = lotArea(l), ps = ringPts(l);
      T(tx, y, l.nombre, fs + 0.3, { w: 700, fill: dark(l.color, 0.8) }); y += rh;
      T(tx, y, `Área ${fmt(a)} m²  (${(a / 10000).toFixed(5)} ha · ${fmt(a / VARA2, 0)} v²)  Perím. ${fmt(perim(ps))} m`, fs * 0.95); y += rh;
      wrap(l.pts.map(i => m.get(i) ? m.get(i).nombre : '?').join('-'), Math.floor(tw / (fs * 0.5))).forEach((ln, i) => { T(tx, y, (i ? '' : 'Puntos: ') + ln, fs * 0.9, { fill: '#444' }); y += rh * 0.88; }); y += 1.5; }
    if (outerArea) { y += 2; T(tx, y, 'POLÍGONO EXTERIOR (TOTAL)', hs, { w: 700 }); y += 5; T(tx, y, `Área ${fmt(outerArea)} m²  (${(outerArea / 10000).toFixed(5)} ha · ${fmt(outerArea / VARA2, 0)} v²)  Perím. ${fmt(outerPer)} m`, fs * 0.95); y += rh;
      wrap(cyc.map(i => m.get(i).nombre).join('-'), Math.floor(tw / (fs * 0.5))).forEach((ln, i) => { T(tx, y, (i ? '' : 'Puntos: ') + ln, fs * 0.9, { fill: '#444' }); y += rh * 0.88; }); }
  }
  const nota = (h.nota || '').trim(); if (nota) { const words = nota.split(/\s+/), lines = []; let cur = ''; const max = Math.floor((W - 2 * M) / 1.45); words.forEach(w => { if ((cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }); if (cur) lines.push(cur); lines.slice(0, 3).forEach((ln, i) => T(M, H - M - noteH + 4 + i * 3.4, (i ? '' : 'Notas: ') + ln, 2.5, { fill: '#444' })); }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm" font-family="Helvetica, Arial, sans-serif">${o.join('\n')}</svg>`;
  return { svg, W, H, sc, warn };
}
let lastSheet = null;
function openSheet() { lastSheet = buildSheet(); $('#sheetWrap').innerHTML = lastSheet.svg; $('#sheetModal').classList.add('on'); document.body.classList.add('sheetopen'); if (lastSheet.warn) toast(lastSheet.warn); }
function closeSheet() { $('#sheetModal').classList.remove('on'); document.body.classList.remove('sheetopen'); }
function exportPNG() {
  const sh = buildSheet(), dpi = 200, pxW = Math.round(sh.W / 25.4 * dpi), pxH = Math.round(sh.H / 25.4 * dpi), img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = pxW; c.height = pxH; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, pxW, pxH); x.drawImage(img, 0, 0, pxW, pxH); c.toBlob(b => download(fname('png'), 'image/png', b), 'image/png'); };
  img.onerror = () => toast('No se pudo generar el PNG en este navegador; usa SVG o PDF'); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sh.svg);
}
function printPDF() { const sh = buildSheet(); $('#pagecss').textContent = `@page{size:${sh.W}mm ${sh.H}mm;margin:0}`; setTimeout(() => window.print(), 60); }

// ---------- arranque ----------
$('#bOpen').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => openText(f.name, String(r.result)); r.readAsText(f); ev.target.value = ''; };
$('#bSave').onclick = () => { download(fname('json'), 'application/json', projectJSON()); toast('Proyecto guardado'); };
$('#bNew').onclick = () => { if (!confirm('¿Empezar un proyecto nuevo? (Guarda antes el actual si lo necesitas)')) return; snapshot(); S = emptyProject(); sel.pt = sel.lot = null; renumPreview = null; persist(); renderAll(); fitView(); setMode('mover'); };
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bSheet').onclick = openSheet;
$('#bFit').onclick = () => { fitView(); drawCanvas(); };
$('#bZin').onclick = () => { V.k = Math.min(V.k * 1.4, 400); drawCanvas(); }; $('#bZout').onclick = () => { V.k = Math.max(V.k / 1.4, 0.05); drawCanvas(); };
$('#xClose').onclick = closeSheet; $('#xPdf').onclick = printPDF; $('#xPng').onclick = exportPNG;
$('#xSvg').onclick = () => download(fname('svg'), 'image/svg+xml', buildSheet().svg);
$('#xDxf').onclick = () => download(fname('dxf'), 'application/dxf', toDXF());
$('#xKml').onclick = () => download(fname('kml'), 'application/vnd.google-earth.kml+xml', toKML());
$('#xCsv').onclick = () => download(fname('csv'), 'text/csv', toCSV());
$('#xJson').onclick = () => download(fname('json'), 'application/json', projectJSON());
window.addEventListener('resize', () => drawCanvas());
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { const r = new FileReader(); r.onload = () => openText(f.name, String(r.result)); r.readAsText(f); } });
(function init() {
  try { const raw = localStorage.getItem(LS); if (raw) S = normalize(JSON.parse(raw)); } catch (e) { S = emptyProject(); }
  renderAll(); fitView(); setMode('mover'); drawCanvas(); updUndo();
  if (!S.puntos.length) $('#status').textContent = 'Proyecto vacío: usa «Abrir…» para cargar tu proyecto (.json), un KML o un CSV, o agrega puntos con ＋ Punto.';
})();
</script>
